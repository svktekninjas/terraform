---
# CF-DB Role Main Tasks Orchestration
# This file orchestrates the creation of Aurora PostgreSQL cluster with cross-VPC access
# Tags allow selective execution: ansible-playbook -t private-subnets (individual tasks)
#                                ansible-playbook -t cf-db (entire role)

- name: Load environment-specific configuration
  include_vars: "../../environments/{{ cf_db_environment }}/cf-db.yml"
  tags:
    - always
    - cf-db

- name: Validate required variables
  assert:
    that:
      - cf_db_config.region is defined
      - cf_db_config.vpc_cidr is defined or (cf_db_config.vpc_id is defined and cf_db_config.vpc_id != "")
    fail_msg: "Required variables are missing. Please check environment configuration."
    success_msg: "All required variables are present. VPC will be {{ 'created' if (cf_db_config.vpc_id == '' or cf_db_config.vpc_id is not defined) else 'used from existing' }}."
  tags:
    - always
    - cf-db
    - validation

- name: Display role execution summary
  debug:
    msg:
      - "=== CF-DB Role Execution Summary ==="
      - "Environment: {{ cf_db_config.common_tags.Environment }}"
      - "Region: {{ cf_db_config.region }}"
      - "VPC ID: {{ cf_db_config.vpc_id if cf_db_config.vpc_id != '' else 'To be created' }}"
      - "VPC CIDR: {{ cf_db_config.vpc_cidr | default('172.31.0.0/16') }}"
      - "Availability Zones: {{ cf_db_config.availability_zones | join(', ') }}"
      - "Database Engine: {{ cf_db_config.database.engine }} {{ cf_db_config.database.engine_version }}"
      - "Cluster Name: {{ cf_db_config.database.cluster_name }}"
      - "Cross-VPC Access: Enabled"
      - "ROSA Conflict: None (using 172.31.0.0/16 CIDR)"
      - "==================================="
  tags:
    - always
    - cf-db

- name: Create Aurora VPC (if needed)
  include_tasks: create_vpc.yml
  when: cf_db_config.vpc_id == "" or cf_db_config.vpc_id is not defined
  tags:
    - cf-db
    - create-vpc
    - networking

- name: Create private subnets (Multi-AZ)
  include_tasks: private_subnets.yml
  tags:
    - cf-db
    - private-subnets
    - networking

- name: Setup NAT Gateway and routing
  include_tasks: nat_gateway.yml
  tags:
    - cf-db
    - nat-gateway
    - networking

- name: Create security groups
  include_tasks: security_groups.yml
  tags:
    - cf-db
    - security-groups
    - security

- name: Setup network connectivity (VPC peering)
  include_tasks: nw_connectivity.yml
  when: cf_db_config.vpc_peering.enabled | default(false)
  tags:
    - cf-db
    - nw-connectivity
    - networking
    - vpc-peering

- name: Create Aurora DB cluster
  include_tasks: db_cluster.yml
  tags:
    - cf-db
    - db-cluster
    - database

- name: Cleanup Aurora DB and network resources
  include_tasks: db_cleanup.yml
  when: cf_db_cleanup is defined and cf_db_cleanup | bool
  tags:
    - db-cleanup
    - cleanup

- name: Display final deployment summary
  debug:
    msg:
      - "=== CF-DB Role Deployment Complete ==="
      - "✅ Private subnets created across 2 AZs"
      - "✅ NAT Gateway and routing configured"
      - "✅ Cross-VPC security groups configured"
      - "{% if cf_db_config.vpc_peering.enabled | default(false) %}✅ VPC peering connectivity established{% endif %}"
      - "✅ Aurora PostgreSQL cluster deployed"
      - ""
      - "Next Steps:"
      - "{% if not (cf_db_config.vpc_peering.enabled | default(false)) %}1. Configure VPC peering/transit gateway for cross-VPC access{% endif %}"
      - "{% if cf_db_config.vpc_peering.enabled | default(false) %}1. Verify VPC peering connection is active{% else %}2. {% endif %}Update ROSA cluster DNS to resolve Aurora endpoints"
      - "{% if cf_db_config.vpc_peering.enabled | default(false) %}2. {% else %}3. {% endif %}Create database secrets in OpenShift"
      - "{% if cf_db_config.vpc_peering.enabled | default(false) %}3. {% else %}4. {% endif %}Test connectivity from ROSA applications"
      - "{% if cf_db_config.vpc_peering.enabled | default(false) %}4. Review VPC peering summary: outputs/vpc-peering.json{% endif %}"
      - "======================================="
  tags:
    - always
    - cf-db

# Role execution examples:
# Full role:           ansible-playbook playbook.yml -t cf-db
# Individual tasks:    ansible-playbook playbook.yml -t create-vpc
#                     ansible-playbook playbook.yml -t private-subnets
#                     ansible-playbook playbook.yml -t nat-gateway
#                     ansible-playbook playbook.yml -t security-groups
#                     ansible-playbook playbook.yml -t nw-connectivity
#                     ansible-playbook playbook.yml -t db-cluster
# Networking only:     ansible-playbook playbook.yml -t networking
# VPC peering only:    ansible-playbook playbook.yml -t vpc-peering
# Database only:       ansible-playbook playbook.yml -t database
# Cleanup all DB:      ansible-playbook playbook.yml -t db-cleanup -e cf_db_environment=dev -e cf_db_cleanup=true