# Setup CloudWatch Container Insights for ROSA cluster
---
- name: "Configure CloudWatch Container Insights addon"
  block:
    - name: "Check if CloudWatch Container Insights addon already exists"
      shell: |
        rosa list addons --cluster {{ full_cluster_name }} --region {{ cloudwatch_region }}
      register: existing_addons_check
      environment:
        AWS_PROFILE: "{{ aws_profile }}"
      failed_when: false
      changed_when: false
      tags:
        - monitoring
        - cloudwatch

    - name: "Enable CloudWatch Container Insights addon"
      shell: |
        rosa create addon container-insights \
          --cluster {{ full_cluster_name }} \
          --region {{ cloudwatch_region }}
      register: cloudwatch_addon_result
      environment:
        AWS_PROFILE: "{{ aws_profile }}"
      failed_when: false
      when: "'container-insights' not in existing_addons_check.stdout"
      tags:
        - monitoring
        - cloudwatch

    - name: "Display CloudWatch addon creation result"
      debug:
        msg:
          - "📊 CloudWatch Container Insights addon:"
          - "  - Cluster: {{ full_cluster_name }}"
          - "  - Region: {{ cloudwatch_region }}"
          - "  - Status: {{ 'Created' if cloudwatch_addon_result.changed else 'Already exists' }}"
          - "  - Log Group: {{ cloudwatch_log_group }}"
      tags:
        - monitoring
        - cloudwatch

- name: "Configure cluster-level CloudWatch logging"
  block:
    - name: "Enable audit logging to CloudWatch"
      shell: |
        rosa edit cluster {{ full_cluster_name }} \
          --audit-log-forwarding-enabled \
          --region {{ cloudwatch_region }}
      register: audit_logging_result
      environment:
        AWS_PROFILE: "{{ aws_profile }}"
      failed_when: false
      tags:
        - monitoring
        - cloudwatch-logs

    - name: "Display audit logging configuration"
      debug:
        msg:
          - "📝 Cluster audit logging configuration:"
          - "  - Audit log forwarding: {{ 'Enabled' if audit_logging_result.rc == 0 else 'Already enabled or error' }}"
          - "  - CloudWatch integration: Active"
      tags:
        - monitoring
        - cloudwatch-logs

- name: "Create CloudWatch log group if it doesn't exist"
  shell: |
    aws logs create-log-group \
      --log-group-name {{ cloudwatch_log_group }} \
      --region {{ cloudwatch_region }} \
      --retention-in-days {{ cloudwatch_log_retention }}
  register: log_group_creation
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
  failed_when: false
  tags:
    - monitoring
    - cloudwatch-logs

- name: "Log CloudWatch setup completion"
  debug:
    msg:
      - "✅ CloudWatch integration setup completed:"
      - "  - Container Insights: {{ 'Enabled' if cloudwatch_addon_result.changed or 'container-insights' in existing_addons_check.stdout else 'Check manually' }}"
      - "  - Log Group: {{ cloudwatch_log_group }}"
      - "  - Log Retention: {{ cloudwatch_log_retention }} days"
      - "  - Region: {{ cloudwatch_region }}"
  tags:
    - monitoring
    - cloudwatch