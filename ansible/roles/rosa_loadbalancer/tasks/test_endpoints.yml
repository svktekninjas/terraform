---
- name: "Get ALB Ingress status and hostname"
  shell: |
    echo "=== Getting ALB Ingress Information ==="
    
    # Check if ALB Ingress exists
    if ! oc get ingress {{ alb_configuration.alb_load_balancer_name }}-ingress -n monitoring &>/dev/null; then
      echo "ERROR: ALB Ingress not found"
      exit 1
    fi
    
    # Get ALB hostname
    alb_hostname=$(oc get ingress {{ alb_configuration.alb_load_balancer_name }}-ingress -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
    
    if [ -z "$alb_hostname" ]; then
      echo "WARNING: ALB hostname not yet available. Checking for annotation..."
      alb_hostname=$(oc get ingress {{ alb_configuration.alb_load_balancer_name }}-ingress -n monitoring -o jsonpath='{.metadata.annotations.alb\.ingress\.kubernetes\.io/load-balancer-name}' 2>/dev/null)
      
      if [ -z "$alb_hostname" ]; then
        echo "ALB is still provisioning. This is normal for new ALB resources."
        echo "ALB_HOSTNAME=pending"
      else
        echo "ALB_HOSTNAME=$alb_hostname"
      fi
    else
      echo "ALB_HOSTNAME=$alb_hostname"
    fi
    
    # Display ALB configuration
    echo "=== ALB Configuration ==="
    echo "ALB Name: {{ alb_configuration.alb_load_balancer_name }}"
    echo "Domain: {{ alb_configuration.alb_domain_name }}"
    echo "Scheme: {{ alb_configuration.alb_scheme }}"
    
    # Show ingress details
    echo "=== Ingress Details ==="
    oc describe ingress {{ alb_configuration.alb_load_balancer_name }}-ingress -n monitoring
  register: alb_status_check
  tags: [loadbalancer, test, validation]

- name: "Display ALB status"
  debug:
    msg: "{{ alb_status_check.stdout }}"
  tags: [loadbalancer, test, validation]

- name: "Extract ALB hostname from output"
  set_fact:
    alb_hostname: "{{ alb_status_check.stdout | regex_search('ALB_HOSTNAME=(.+)', '\\1') | first }}"
  when: "'ALB_HOSTNAME=' in alb_status_check.stdout"
  tags: [loadbalancer, test, validation]

- name: "Check AWS ALB status"
  shell: |
    echo "=== Checking AWS ALB Status ==="
    
    # Check if ALB exists in AWS
    alb_arn=$(aws elbv2 describe-load-balancers --names {{ alb_configuration.alb_load_balancer_name }} --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || echo "none")
    
    if [ "$alb_arn" != "none" ] && [ "$alb_arn" != "None" ]; then
      echo "ALB found in AWS: $alb_arn"
      
      # Get ALB DNS name
      alb_dns=$(aws elbv2 describe-load-balancers --names {{ alb_configuration.alb_load_balancer_name }} --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null)
      echo "ALB DNS Name: $alb_dns"
      
      # Get ALB state
      alb_state=$(aws elbv2 describe-load-balancers --names {{ alb_configuration.alb_load_balancer_name }} --query 'LoadBalancers[0].State.Code' --output text 2>/dev/null)
      echo "ALB State: $alb_state"
      
      # Get target groups
      echo "=== Target Groups ==="
      aws elbv2 describe-target-groups --load-balancer-arn $alb_arn --query 'TargetGroups[*].[TargetGroupName,HealthCheckPath,HealthCheckProtocol,HealthCheckPort]' --output table 2>/dev/null || echo "No target groups found"
      
    else
      echo "ALB not found in AWS yet. This is normal for new Ingress resources."
      echo "The ALB Controller may still be processing the Ingress resource."
    fi
  register: aws_alb_check
  tags: [loadbalancer, test, validation]

- name: "Display AWS ALB status"
  debug:
    msg: "{{ aws_alb_check.stdout }}"
  tags: [loadbalancer, test, validation]

- name: "Test internal ClusterIP services"
  shell: |
    echo "=== Testing ClusterIP Services ==="
    
    # Test services using internal cluster networking
    services=(
      "grafana.monitoring.svc.cluster.local:3000{{ service_path_mapping.grafana }}"
      "prometheus.monitoring.svc.cluster.local:9090{{ service_path_mapping.prometheus }}"
      "alertmanager.monitoring.svc.cluster.local:9093{{ service_path_mapping.alertmanager }}"
    )
    
    for service in "${services[@]}"; do
      service_url="http://$service"
      service_name=$(echo $service | cut -d'.' -f1)
      
      echo "Testing $service_name: $service_url"
      
      # Use curl with timeout
      if timeout 10 curl -s -o /dev/null -w "%{http_code}" "$service_url" 2>/dev/null; then
        status_code=$(timeout 10 curl -s -o /dev/null -w "%{http_code}" "$service_url" 2>/dev/null)
        echo "  Status: $status_code"
        
        if [ "$status_code" = "200" ] || [ "$status_code" = "302" ] || [ "$status_code" = "301" ]; then
          echo "  Result: PASS"
        else
          echo "  Result: FAIL (Status: $status_code)"
        fi
      else
        echo "  Result: FAIL (Connection timeout or error)"
      fi
    done
  register: clusterip_tests
  tags: [loadbalancer, test, validation]

- name: "Display ClusterIP test results"
  debug:
    msg: "{{ clusterip_tests.stdout }}"
  tags: [loadbalancer, test, validation]

- name: "Test ALB endpoints if hostname is available"
  shell: |
    echo "=== Testing ALB Endpoints ==="
    
    alb_hostname="{{ alb_hostname | default('') }}"
    
    if [ -z "$alb_hostname" ] || [ "$alb_hostname" = "pending" ]; then
      echo "ALB hostname not available yet. Testing via AWS ALB DNS name..."
      
      # Try to get DNS name from AWS
      alb_dns=$(aws elbv2 describe-load-balancers --names {{ alb_configuration.alb_load_balancer_name }} --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null)
      
      if [ -n "$alb_dns" ] && [ "$alb_dns" != "None" ]; then
        alb_hostname="$alb_dns"
        echo "Using ALB DNS name: $alb_hostname"
      else
        echo "ALB DNS name not available. ALB may still be provisioning."
        echo "This is normal for new ALB resources and can take 2-3 minutes."
        exit 0
      fi
    fi
    
    # Test endpoints
    endpoints=(
      "grafana{{ service_path_mapping.grafana }}"
      "prometheus{{ service_path_mapping.prometheus }}"
      "alertmanager{{ service_path_mapping.alertmanager }}"
    )
    
    for endpoint in "${endpoints[@]}"; do
      service_name=$(echo $endpoint | cut -d'/' -f1)
      path=$(echo $endpoint | cut -d'/' -f2-)
      url="http://$alb_hostname/$path"
      
      echo "Testing $service_name: $url"
      
      # Use curl with timeout and retries
      for i in {1..3}; do
        if timeout 30 curl -s -o /dev/null -w "%{http_code}" "$url" 2>/dev/null; then
          status_code=$(timeout 30 curl -s -o /dev/null -w "%{http_code}" "$url" 2>/dev/null)
          echo "  Attempt $i - Status: $status_code"
          
          if [ "$status_code" = "200" ] || [ "$status_code" = "302" ] || [ "$status_code" = "301" ]; then
            echo "  Result: PASS"
            break
          elif [ "$status_code" = "404" ]; then
            echo "  Result: FAIL (404 - Path not found, check path configuration)"
            break
          else
            echo "  Result: FAIL (Status: $status_code)"
            if [ $i -eq 3 ]; then
              echo "  All retries failed for $service_name"
            fi
          fi
        else
          echo "  Attempt $i - Connection timeout or error"
          if [ $i -eq 3 ]; then
            echo "  Result: FAIL (Connection timeout after 3 attempts)"
          fi
        fi
        
        if [ $i -lt 3 ]; then
          sleep 10
        fi
      done
    done
  register: alb_endpoint_tests
  when: alb_hostname is defined
  tags: [loadbalancer, test, validation]

- name: "Display ALB endpoint test results"
  debug:
    msg: "{{ alb_endpoint_tests.stdout }}"
  when: alb_endpoint_tests.stdout is defined
  tags: [loadbalancer, test, validation]

- name: "Check ALB Controller logs for troubleshooting"
  shell: |
    echo "=== ALB Controller Logs (Last 50 lines) ==="
    oc logs -n aws-load-balancer-controller deployment/aws-load-balancer-controller --tail=50
  register: alb_controller_logs
  tags: [loadbalancer, test, validation]

- name: "Display ALB Controller logs"
  debug:
    msg: "{{ alb_controller_logs.stdout }}"
  tags: [loadbalancer, test, validation]

- name: "Create endpoint test summary"
  shell: |
    timestamp=$(date +%s)
    summary_file="/tmp/endpoint_test_summary_$timestamp.txt"
    
    echo "=== Endpoint Test Summary ===" > $summary_file
    echo "Date: $(date)" >> $summary_file
    echo "Environment: {{ target_environment | default('dev') }}" >> $summary_file
    echo "ALB Name: {{ alb_configuration.alb_load_balancer_name }}" >> $summary_file
    echo "Domain: {{ alb_configuration.alb_domain_name }}" >> $summary_file
    echo "ALB Hostname: {{ alb_hostname | default('Not Available') }}" >> $summary_file
    echo "" >> $summary_file
    echo "Test Results:" >> $summary_file
    echo "============" >> $summary_file
    echo "" >> $summary_file
    echo "ClusterIP Service Tests:" >> $summary_file
    echo "{{ clusterip_tests.stdout }}" >> $summary_file
    echo "" >> $summary_file
    echo "ALB Endpoint Tests:" >> $summary_file
    echo "{{ alb_endpoint_tests.stdout | default('ALB hostname not available') }}" >> $summary_file
    echo "" >> $summary_file
    echo "Configured Paths:" >> $summary_file
    echo "- Grafana: {{ service_path_mapping.grafana }}" >> $summary_file
    echo "- Prometheus: {{ service_path_mapping.prometheus }}" >> $summary_file
    echo "- Alertmanager: {{ service_path_mapping.alertmanager }}" >> $summary_file
    echo "" >> $summary_file
    echo "Expected URLs (when ALB is ready):" >> $summary_file
    echo "- Grafana: http://{{ alb_hostname | default('ALB-HOSTNAME') }}{{ service_path_mapping.grafana }}" >> $summary_file
    echo "- Prometheus: http://{{ alb_hostname | default('ALB-HOSTNAME') }}{{ service_path_mapping.prometheus }}" >> $summary_file
    echo "- Alertmanager: http://{{ alb_hostname | default('ALB-HOSTNAME') }}{{ service_path_mapping.alertmanager }}" >> $summary_file
    
    echo "Summary saved to: $summary_file"
    echo ""
    echo "=== Summary Contents ==="
    cat $summary_file
  register: test_summary
  tags: [loadbalancer, test, validation]

- name: "Display final test summary"
  debug:
    msg: "{{ test_summary.stdout }}"
  tags: [loadbalancer, test, validation]

- name: "Validation status"
  debug:
    msg: |
      Task 5 - Endpoint Testing Complete
      
      Status: {{ 'ALB PROVISIONING' if alb_hostname is not defined or alb_hostname == 'pending' else 'ALB READY' }}
      
      Next Steps:
      {% if alb_hostname is not defined or alb_hostname == 'pending' %}
      - Wait for ALB provisioning to complete (2-3 minutes)
      - Check ALB status: aws elbv2 describe-load-balancers --names {{ alb_configuration.alb_load_balancer_name }}
      - Re-run endpoint tests when ALB is ready
      {% else %}
      - ALB is ready for DNS configuration
      - Proceed to Task 6: DNS/SSL setup
      {% endif %}
  tags: [loadbalancer, test, validation]