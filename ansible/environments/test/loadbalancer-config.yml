# Test Environment Load Balancer Configuration
---
# Environment Configuration
environment_name: "test"
environment_suffix: "test"

# ALB Configuration
alb_configuration:
  base_domain: "svktek-test.example.com"
  alb_domain_name: "svktek-test.rosa.example.com"
  alb_load_balancer_name: "monitoring-alb-test"
  alb_scheme: "internet-facing"
  alb_target_type: "instance"
  alb_group_name: "monitoring-test"

# SSL/TLS Configuration
ssl_configuration:
  ssl_redirect_enabled: true
  ssl_redirect_port: 443
  certificate_arn: ""  # Add ACM certificate ARN for SSL when available
  validate_ssl_certificates: true

# Target Namespaces for Load Balancer Optimization
target_namespaces:
  - "monitoring"

# Service Path Mapping
service_path_mapping:
  grafana: "/grafana"
  prometheus: "/prometheus"
  alertmanager: "/alertmanager"
  openshift-prometheus: "/openshift-prometheus"
  openshift-alertmanager: "/openshift-alertmanager"

# Health Check Configuration
healthcheck_configuration:
  healthcheck_path: "/"
  healthcheck_interval: 30
  healthcheck_timeout: 5
  healthy_threshold: 2
  unhealthy_threshold: 5

# ALB Tags
alb_tags:
  Environment: "test"
  Project: "ROSA"
  Owner: "SRE-Team"
  Purpose: "Monitoring"
  CostCenter: "Engineering"

# Validation and Testing
validation_configuration:
  endpoint_test_timeout: 90
  endpoint_test_retries: 5
  validate_endpoints_after_creation: true
  fail_on_validation_error: true

# Cleanup Configuration
cleanup_configuration:
  cleanup_old_elbs: true
  cleanup_timeout: 300
  backup_old_configurations: true

# Test specific settings
test_settings:
  debug_mode: false
  verbose_logging: true
  enable_debug_annotations: false
  skip_ssl_validation: false
  allow_insecure_connections: false